<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: aqua;
        }
        p{
            color: blueviolet;
        }
        .subheading{
            color: brown;
        }
        #first{
            color: chartreuse;
        }
        a:hover{
            color:pink;
        }
        ul li{
            color: orange;
        }
        ul > li:last-child{
            color:darkcyan;
        }
    </style>
</head>
<body>
    <div>this is div
        <p id="first">this is paragraph</p>
        <p class = "subheading">this is new paragraph</p>
        <a href="#">Link</a>
        <ul>
            <li>item 1</li>
            <li>item 2</li>
        </ul>
    </div>
    <h1>this is h1</h1>
    <span style="display: block;">this is span</span>
    <span>this is another span</span>
    <div>this is div1</div>
    <div>this is div2</div>
</body>
</html>
